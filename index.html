<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doğum Günün Kutlu Olsun!</title>

<style>
    /* Google Fonts linkini ekliyoruz (Eğer tarayıcı desteklerse daha iyi görünür) */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

    body {
        margin: 0;
        height: 100vh;
        /* Arka plan rengi */
        background: linear-gradient(120deg, #ff7eb3, #ff758c, #ffb199);
        display: flex;
        flex-direction: column; /* Öğeleri dikeyde ortalamak için */
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: 'Poppins', sans-serif;
        color: white;
        text-align: center;
    }

    h1 {
        font-size: 2.5rem;
        animation: fadeIn 2s ease-in-out forwards;
        opacity: 0;
        padding: 0 20px;
        margin-bottom: 20px; /* Butondan ayırmak için */
    }

    @keyframes fadeIn {
        to { opacity: 1; }
    }

    .button {
        padding: 12px 25px;
        background: white;
        color: #ff4f82;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-size: 1.2rem;
        transition: .3s;
        z-index: 10; /* Balonların üstünde olması için */
    }

    .button:hover {
        transform: scale(1.1);
        background: #ffe4ec;
    }

    /* Pasta animasyonu */
    .cake {
        width: 180px; /* Resmin boyutunu biraz büyüttüm */
        height: auto;
        position: absolute;
        bottom: -250px; /* Ekrandan daha aşağıda başlasın */
        left: 50%;
        transform: translateX(-50%);
        animation: cakeUp 3s ease forwards;
        display: none;
        z-index: 5;
    }

    @keyframes cakeUp {
        0% { bottom: -250px; opacity: 0; }
        100% { bottom: 50px; opacity: 1; } /* Pastanın duracağı son nokta */
    }

    /* Mum */
    .candle {
        width: 12px;
        height: 35px;
        background: #fff5e6;
        border-radius: 4px;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 160px; /* Pastanın üzerinde durması için ayarlandı */
        display: none;
        z-index: 6;
    }

    /* Alev */
    .flame {
        width: 14px;
        height: 22px;
        background: radial-gradient(circle, #ffeb3b 30%, #ff9800 70%);
        border-radius: 50%;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 185px; /* Mumun üzerinde durması için ayarlandı */
        opacity: 0.9;
        animation: flicker 0.15s infinite alternate;
        display: none;
        z-index: 7;
    }

    @keyframes flicker {
        0% { transform: translateX(-50%) scale(1); opacity: 0.9; }
        100% { transform: translateX(-50%) scale(1.2); opacity: 1; }
    }

    /* Konfeti */
    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        top: -20px;
        animation: fall 3s linear infinite;
        z-index: 99; /* En üstte olması için */
    }

    @keyframes fall {
        to { transform: translateY(120vh) rotate(360deg); }
    }

    /* Balonlar */
    .balloon {
        position: absolute;
        width: 40px;
        height: 55px;
        border-radius: 50%;
        opacity: 0.75;
        animation: float 6s infinite ease-in;
        z-index: 1;
    }

    @keyframes float {
        from { transform: translateY(100vh); }
        to { transform: translateY(-120vh); }
    }
</style>
</head>

<body>

<h1>🎉 DOĞUM GÜNÜN KUTLU OLSUN DOĞUM GÜNÜ KIZI 🎂</h1>

<button class="button" onclick="surprise()">Sürprize Tıkla 🎁</button>

<h2 id="message" style="margin-top:20px; display:none; font-size:1.8rem;"></h2>

<img class="cake" id="cake" src="pasta.png">

<div class="candle" id="candle"></div>
<div class="flame" id="flame"></div>

<audio id="music" src="music.mp3"></audio>

<script>
    function surprise() {
        // Butonu gizle veya değiştir
        document.querySelector('.button').style.display = 'none';

        // Mesaj
        const msg = document.getElementById("message");
        msg.innerText = "Nice mutlu, sağlıklı, harika yıllara! 🎈✨";
        msg.style.display = "block";

        // Pasta görünür
        document.getElementById("cake").style.display = "block";

        // Mum + alev görünür
        document.getElementById("candle").style.display = "block";
        document.getElementById("flame").style.display = "block";

        // Müzik başlat
        const music = document.getElementById("music");
        music.volume = 0.6; // Sesi biraz azalttım, çok yüksek çalmasın
        music.play();

        // Konfeti yağmuru
        for (let i = 0; i < 60; i++) {
            let c = document.createElement("div");
            c.classList.add("confetti");
            c.style.left = Math.random() * 100 + "vw";
            c.style.background = "hsl(" + Math.random()*360 + ",100%,60%)";
            c.style.animationDuration = (2 + Math.random()*2) + "s";
            document.body.appendChild(c);

            setTimeout(() => c.remove(), 4000);
        }
    }

    // Balonlar otomatik
    for (let i = 0; i < 20; i++) {
        let b = document.createElement("div");
        b.classList.add("balloon");
        b.style.left = Math.random() * 100 + "vw";
        b.style.animationDuration = (4 + Math.random() * 4) + "s";
        b.style.background = "hsl(" + Math.random() * 360 + ", 80%, 70%)";
        document.body.appendChild(b);
    }
</script>

</body>
</html>
